name: Publish metadata post-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact post-release version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Verify post-release version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import runpy
          import tomllib
          from pathlib import Path
          from packaging.version import Version

          expected = Version(os.environ['EXPECTED_VERSION'])
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          runtime = runpy.run_path('src/kairyou/version.py')['VERSION']
          assert expected.is_postrelease, 'Only metadata post-releases are supported'
          assert Version(project['version']) == Version(runtime) == expected
          PY
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish_to_pypi:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
